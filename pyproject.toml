[build-system]
# pybind11 builds the optional native control loop (setup.py). Its internals version must
# be pylibfranka's (12, pybind11 3.1) for the loop to hand out pylibfranka.RobotState objects.
requires = ["setuptools>=77.0.3", "pybind11>=3.1,<3.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aiofranka"
version = "0.7.0"
description = "A Python package for Franka robot control using asyncio."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "aiofranka/model/LICENSE"]
authors = [
    {name = "MIT Improbable AI Lab"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # PyPI has no official macOS build of pylibfranka. pylibfranka-macos is an unofficial one for
    # Apple Silicon and macOS 15 or newer. On other Macs, build pylibfranka from source. No
    # platform_release in the marker: pip 25 evaluates it everywhere, and fails on Linux kernel
    # releases such as 6.8.0-45-generic, which are not versions.
    "pylibfranka; sys_platform != 'darwin'",
    "pylibfranka-macos; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "ruckig",
    "numpy",
    "scipy",
    "mujoco>=3.10",
    "tqdm",
    "requests",
    "pyzmq",
    "msgpack",
    "pyyaml",
]

[project.scripts]
aiofranka = "aiofranka.__main__:main"

[project.optional-dependencies]
# Custom control laws of NativeFrankaController, compiled with Numba.
native = [
    "numba>=0.60",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]
robotiq = [
    "minimalmodbus",
    "pyrobotiqgripper",
]
# aiofranka camera calibrate: aiocamera serves the frames, aprilcube detects the cube.
camera = [
    "aprilcube>=0.3",
    "aiocamera[realsense]>=0.1",
]

[project.urls]
Homepage = "https://github.com/younghyopark/aiofranka"
Repository = "https://github.com/younghyopark/aiofranka"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["aiofranka", "aiofranka.*"]
namespaces = false

[tool.setuptools.package-data]
aiofranka = [
    "calibration_cube.json",
    "model/fr3.xml",
    "model/scene.xml",
    "model/assets/link*_*.obj",
    "model/assets/link1.obj",
    "model/assets/link2.obj",
    "model/assets/*.stl",
]
